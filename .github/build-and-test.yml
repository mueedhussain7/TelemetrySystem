name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore TelemetrySystem.sln

      - name: Build
        run: dotnet build TelemetrySystem.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TelemetrySystem.sln --configuration Release --no-build --verbosity normal